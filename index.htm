<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay Đồng Hồ & Banner</title>
<style> 
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: rgba(150, 0, 0, 0.92);
    font-family: Arial, Tahoma, "Segoe UI", sans-serif;
    font-weight: 900;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Khung bao ngoài căn giữa */
  #wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Cụm banner 4 hàng sát nhau */
  #banner {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px; /* Khoảng cách giữa các hàng rất sát và đều */
    transform-origin: center center;
    white-space: nowrap;
    will-change: transform;
  }

  .line {
    white-space: nowrap;
    text-align: center;
    line-height: 1.15;
    /* Viền đen đổ bóng sắc nét, chống chìm chữ trên video */
    text-shadow: 
      2px 2px 0 #000, -2px -2px 0 #000, 
      2px -2px 0 #000, -2px 2px 0 #000,
      0 4px 6px rgba(0, 0, 0, 0.9);
  }

  /* Màu sắc và cỡ chữ cân đối cho từng dòng */
  .line-1 { 
    color: #00ffff; /* Xanh Cyan */
    font-size: 34px; 
  }
  .line-2 { 
    color: #00ff88; /* Xanh Neon nổi bật */
    font-size: 38px; 
  }
  .line-3 { 
    color: #ffff00; /* Vàng */
    font-size: 40px; 
  }
  .line-4 { 
    color: #ffffff; /* Trắng */
    font-size: 40px; 
  }
</style>
</head>
<body>

  <div id="wrapper">
    <div id="banner">
      <!-- Dòng 1: Giờ phút ngày tháng + inbox zLa0 -->
      <div class="line line-1"><span id="clock">--h-- --/--</span> inbox zLa0:</div>
      
      <!-- Dòng 2: Số điện thoại + Nhận khuyến mãi -->
      <div class="line line-2">@878--660..+304NHẬN K.MÃI</div>
      
      <!-- Dòng 3: Full Vip Pro -->
      <div class="line line-3">FULL VIP PRO: 250K/THÁNG</div>
      
      <!-- Dòng 4: Máp soi hack -->
      <div class="line line-4">MÁP SOI HACK: 139K/THÁNG</div>
    </div>
  </div>

<script>
  function autoFit() {
    const banner = document.getElementById('banner');
    if (!banner) return;

    // Reset scale tạm thời để lấy kích thước gốc
    banner.style.transform = 'scale(1)';

    const w = banner.offsetWidth;
    const h = banner.offsetHeight;
    if (w === 0 || h === 0) return;

    // Giới hạn an toàn: Rộng tối đa 86%, Cao tối đa 90%
    // Đảm bảo 2 bên mép luôn có khoảng đệm 7% an toàn, không bao giờ bị cắt chữ
    const maxW = window.innerWidth * 0.86;
    const maxH = window.innerHeight * 0.90;

    // Thu/phóng đồng dạng giữ nguyên tỉ lệ (chữ không bao giờ bị méo bẹp)
    const scale = Math.min(maxW / w, maxH / h);
    banner.style.transform = `scale(${scale})`;
  }

  let lastTimeStr = '';
  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const day = String(now.getDate()).padStart(2, '0');
    const month = String(now.getMonth() + 1).padStart(2, '0');
    
    // Định dạng: Giờ:phút Ngày/tháng (ví dụ: 10h14 11/10)
    const timeStr = `${hours}h${minutes} ${day}/${month}`;

    if (timeStr !== lastTimeStr) {
      lastTimeStr = timeStr;
      const clockEl = document.getElementById('clock');
      if (clockEl) {
        clockEl.textContent = timeStr;
      }
      autoFit();
    }
  }

  window.addEventListener('resize', autoFit);

  // Khởi chạy ngay khi tải trang
  updateClock();
  autoFit();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
