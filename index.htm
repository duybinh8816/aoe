<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Overlay Đồng Hồ & Banner</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: rgba(150, 0, 0, 0.92);
    font-family: Arial, Tahoma, "Segoe UI", sans-serif;
    font-weight: 900;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  #container {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: space-evenly;
    padding: 0 3%; /* Đệm 3% hai bên để không bị dính sát mép */
  }

  .line {
    width: 100%;
    height: 33.33%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    white-space: nowrap;
    text-shadow: 2px 2px 3px #000, -2px -2px 3px #000, 2px -2px 3px #000, -2px 2px 3px #000;
  }

  .txt {
    display: inline-block;
    white-space: nowrap;
    transform-origin: center center;
    will-change: transform;
  }

  .line-1 { color: #00ffff; }
  .line-2 { color: #ffff00; }
  .line-3 { color: #ffffff; }
</style>
</head>
<body>

  <div id="container">
    <div class="line line-1"><span class="txt" id="txt1"><span id="clock">--h--</span> |ibzL..0878--660..+304NHẬN KMÃI</span></div>
    <div class="line line-2"><span class="txt" id="txt2">FULL VIP PRO: 250K/THÁNG</span></div>
    <div class="line line-3"><span class="txt" id="txt3">MÁP SOI HACK: 139K/THÁNG</span></div>
  </div>

<script>
  let lastTimeStr = '';

  function fitLine(el, maxW, maxH) {
    if (!el) return;
    // Tạm bỏ scale để lấy kích thước gốc
    el.style.transform = 'scale(1)';
    const naturalW = el.offsetWidth;
    const naturalH = el.offsetHeight;

    if (naturalW > 0 && naturalH > 0) {
      // Giữ tỉ lệ chữ tự nhiên (không kéo méo bè)
      const scale = Math.min(maxW / naturalW, maxH / naturalH);
      el.style.transform = `scale(${scale})`;
    }
  }

  function autoFitAll() {
    const container = document.getElementById('container');
    const availableW = container.clientWidth;
    const availableH = (window.innerHeight / 3) * 0.92; // Chừa khoảng cách dòng thoáng mắt

    // Đặt font-size cơ sở một lần
    const baseFontSize = 40; 
    for (let i = 1; i <= 3; i++) {
      const el = document.getElementById('txt' + i);
      if (el) el.style.fontSize = baseFontSize + 'px';
    }

    for (let i = 1; i <= 3; i++) {
      fitLine(document.getElementById('txt' + i), availableW, availableH);
    }
  }

  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const timeStr = `${hours}h${minutes}`;

    // Chỉ cập nhật DOM và tính lại kích thước khi phút thực sự thay đổi
    if (timeStr !== lastTimeStr) {
      lastTimeStr = timeStr;
      document.getElementById('clock').textContent = timeStr;
      
      // Chỉ cần tính lại riêng dòng 1 khi giờ đổi, không cần quét cả 3 dòng
      const container = document.getElementById('container');
      fitLine(document.getElementById('txt1'), container.clientWidth, (window.innerHeight / 3) * 0.92);
    }
  }

  // Lắng nghe resize màn hình
  window.addEventListener('resize', autoFitAll);

  // Khởi chạy lần đầu
  updateClock();
  autoFitAll();

  // Kiểm tra mỗi 1 giây (nhưng chỉ render lại khi đổi phút)
  setInterval(updateClock, 1000);
</script>
</body>
</html>
