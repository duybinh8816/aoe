<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay Đồng Hồ & Banner</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: rgba(150, 0, 0, 0.92);
    font-family: Arial, Tahoma, "Segoe UI", sans-serif;
    font-weight: 900;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Khung bao ngoài toàn màn hình, đưa nội dung vào chính giữa */
  #container {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Khối banner: Gom các hàng nằm sát nhau, đồng nhất tỉ lệ */
  #banner {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px; /* Chữ sát các hàng, cách nhau vừa vặn */
    transform-origin: center center;
    white-space: nowrap;
    will-change: transform;
  }

  .line {
    white-space: nowrap;
    text-align: center;
    line-height: 1.15;
    /* Đổ bóng viền đen sắc nét, chống chìm chữ */
    text-shadow: 
      2px 2px 0 #000, -2px -2px 0 #000, 
      2px -2px 0 #000, -2px 2px 0 #000,
      0 3px 5px rgba(0,0,0,0.85);
  }

  /* Kích thước font chuẩn giúp bố cục cân đối giữa các dòng */
  .line-1 { 
    color: #00ffff; 
    font-size: 38px;
  }
  .line-2 { 
    color: #ffff00; 
    font-size: 42px; 
  }
  .line-3 { 
    color: #ffffff; 
    font-size: 42px; 
  }
</style>
</head>
<body>

  <div id="container">
    <div id="banner">
      <div class="line line-1"><span id="clock">--h--</span> |ibzL..0878--660..+304NHẬN KMÃI</div>
      <div class="line line-2">FULL VIP PRO: 250K/THÁNG</div>
      <div class="line line-3">MÁP SOI HACK: 139K/THÁNG</div>
    </div>
  </div>

<script>
  function autoFit() {
    const banner = document.getElementById('banner');
    if (!banner) return;

    // Bỏ scale tạm thời để lấy kích thước gốc thực tế
    banner.style.transform = 'scale(1)';

    const naturalW = banner.offsetWidth;
    const naturalH = banner.offsetHeight;

    if (naturalW === 0 || naturalH === 0) return;

    // Giới hạn an toàn: Chừa lề trái phải mỗi bên 7% (lấy tối đa 86% màn hình)
    // Chiều cao lấy tối đa 88% để không chạm trần và đáy
    const maxW = window.innerWidth * 0.86;
    const maxH = window.innerHeight * 0.88;

    // Thu/phóng theo tỉ lệ đồng dạng (không kéo dãn méo chữ)
    const scale = Math.min(maxW / naturalW, maxH / naturalH);
    banner.style.transform = `scale(${scale})`;
  }

  let lastTimeStr = '';
  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const timeStr = `${hours}h${minutes}`;

    if (timeStr !== lastTimeStr) {
      lastTimeStr = timeStr;
      const clockEl = document.getElementById('clock');
      if (clockEl) {
        clockEl.textContent = timeStr;
      }
      autoFit();
    }
  }

  // Tự động căn chỉnh khi thay đổi kích thước khung hình OBS hoặc trình duyệt
  window.addEventListener('resize', autoFit);

  // Khởi chạy ban đầu
  updateClock();
  autoFit();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
