<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay Đồng Hồ & Banner</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: rgba(150, 0, 0, 0.92);
    font-family: Arial, Tahoma, "Segoe UI", sans-serif;
    font-weight: 900;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* Khung bao ngoài căn giữa toàn màn hình */
  #wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Cụm banner gom 3 dòng nằm sát nhau */
  #banner {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px; /* Khoảng cách giữa các hàng rất sát và đẹp */
    transform-origin: center center;
    white-space: nowrap;
    will-change: transform;
  }

  .line {
    white-space: nowrap;
    text-align: center;
    line-height: 1.1;
    /* Viền đen đậm quanh chữ giúp cực kỳ sắc nét trên livestream */
    text-shadow: 
      2px 2px 0 #000, -2px -2px 0 #000, 
      2px -2px 0 #000, -2px 2px 0 #000,
      0 4px 6px rgba(0, 0, 0, 0.9);
  }

  /* Cỡ font chuẩn giúp độ to nhỏ giữa 3 dòng đồng đều */
  .line-1 { 
    color: #00ffff; 
    font-size: 38px; 
  }
  .line-2 { 
    color: #ffff00; 
    font-size: 42px; 
  }
  .line-3 { 
    color: #ffffff; 
    font-size: 42px; 
  }
</style>
</head>
<body>

  <div id="wrapper">
    <div id="banner">
      <div class="line line-1"><span id="clock">--h--</span> |ibzL..0878--660..+304NHẬN KMÃI</div>
      <div class="line line-2">FULL VIP PRO: 250K/THÁNG</div>
      <div class="line line-3">MÁP SOI HACK: 139K/THÁNG</div>
    </div>
  </div>

<script>
  function autoFit() {
    const banner = document.getElementById('banner');
    if (!banner) return;

    // Tạm reset scale để đo kích thước thực tế
    banner.style.transform = 'scale(1)';

    const w = banner.offsetWidth;
    const h = banner.offsetHeight;
    if (w === 0 || h === 0) return;

    // Giới hạn vùng an toàn: chỉ chiếm tối đa 86% chiều rộng và 88% chiều cao
    // Đảm bảo luôn có khoảng đệm 7% ở cả 2 bên mép trái - phải
    const maxW = window.innerWidth * 0.86;
    const maxH = window.innerHeight * 0.88;

    // Phóng to/thu nhỏ đồng dạng giữ nguyên tỉ lệ font (không bao giờ méo chữ)
    const scale = Math.min(maxW / w, maxH / h);
    banner.style.transform = `scale(${scale})`;
  }

  let lastTimeStr = '';
  function updateClock() {
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const timeStr = `${hours}h${minutes}`;

    if (timeStr !== lastTimeStr) {
      lastTimeStr = timeStr;
      const clockEl = document.getElementById('clock');
      if (clockEl) {
        clockEl.textContent = timeStr;
      }
      autoFit();
    }
  }

  window.addEventListener('resize', autoFit);

  // Chạy lần đầu
  updateClock();
  autoFit();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
